kind = "web"
previewPath = "/"
title = "Onichan Web Panel"
description = "Web panel and dashboard for the Onichan Telegram bot, serving the Flask-based admin and user interface."
version = "1.0.0"
id = "artifacts/onichan-web"
router = "path"

[[services]]
name = "web"
paths = ["/"]
localPort = 21353

[services.development]
run = "pnpm --filter @workspace/onichan-web run dev"

[services.production]

# Makes sure the workspace-local CPython 3.14 + venv exist in the image (no-op when already present).
[services.production.build]
args = ["bash", "scripts/setup-python314.sh"]

# Starts the bot on CPython 3.14 (scripts/run-bot.sh strips Replit's python-3.11 environment).
[services.production.run]
args = ["bash", "scripts/run-bot.sh"]

[services.production.run.env]
PORT = "21353"

[services.env]
PORT = "21353"
BASE_PATH = "/"
