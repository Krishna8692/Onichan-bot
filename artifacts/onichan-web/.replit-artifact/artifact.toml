kind = "web"
previewPath = "/"
title = "Onichan Web Panel"
description = "Web panel and dashboard for the Onichan Telegram bot, serving the Flask-based admin and user interface."
version = "1.0.0"
id = "artifacts/onichan-web"
router = "path"

[[services]]
name = "web"
paths = ["/"]
localPort = 21353

[services.development]
run = "pnpm --filter @workspace/onichan-web run dev"

[services.production]

# Provision the bot runtime and separate restricted Hermes runtime.
[services.production.build]
args = ["bash", "scripts/setup-production.sh"]

# Independently supervise the bot and authenticated loopback-only Hermes.
[services.production.run]
args = ["bash", "scripts/run-production.sh"]

[services.production.run.env]
PORT = "21353"

[services.env]
PORT = "21353"
BASE_PATH = "/"
